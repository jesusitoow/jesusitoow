<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'Courier New', Courier, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e62429"/><stop offset="100%" stop-color="#f5b942"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.55"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panel"><rect x="1" y="1" width="798" height="298" rx="14"/></clipPath>
  </defs>
  <rect x="1" y="1" width="798" height="298" rx="14" fill="#0d0d14" stroke="#7a1520" stroke-width="2"/>
  <g clip-path="url(#panel)">
    <rect x="0" y="0" width="800" height="46" fill="#16161f"/>
    <text x="28" y="30" fill="#f5b942" font-size="16" font-weight="bold" letter-spacing="3">J.A.R.V.I.S.  //  AI ASSESSMENT</text>
    <circle cx="766" cy="23" r="5" fill="#e62429"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="752" y="28" fill="#9a9aa5" font-size="12" text-anchor="end">LIVE</text>
    <rect x="0" y="46" width="800" height="2" fill="#7a1520"/>
    <rect x="0" y="46" width="160" height="2" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" from="-160 0" to="800 0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="28" y="97" fill="#e6e6e6" font-size="15" letter-spacing="1.5">CURIOSITY LEVEL</text>
    <rect x="330" y="86" width="300" height="12" rx="6" fill="#1b1b26"/>
    <rect x="330" y="86" width="0" height="12" rx="6" fill="url(#bar)">
      <animate attributeName="width" values="0;300.0;300.0;0" keyTimes="0;0.3;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="654" y="97" fill="#f5b942" font-size="15" font-weight="bold">100%</text>
    <text x="28" y="139" fill="#e6e6e6" font-size="15" letter-spacing="1.5">DISCIPLINE INDEX</text>
    <rect x="330" y="128" width="300" height="12" rx="6" fill="#1b1b26"/>
    <rect x="330" y="128" width="0" height="12" rx="6" fill="url(#bar)">
      <animate attributeName="width" values="0;276.0;276.0;0" keyTimes="0;0.3;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="654" y="139" fill="#f5b942" font-size="15" font-weight="bold">92%</text>
    <text x="28" y="181" fill="#e6e6e6" font-size="15" letter-spacing="1.5">LEARNING CAPACITY</text>
    <rect x="330" y="170" width="300" height="12" rx="6" fill="#1b1b26"/>
    <rect x="330" y="170" width="0" height="12" rx="6" fill="url(#bar)">
      <animate attributeName="width" values="0;300.0;300.0;0" keyTimes="0;0.3;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="654" y="181" fill="#f5b942" font-size="15" font-weight="bold">∞</text>
    <text x="28" y="223" fill="#e6e6e6" font-size="15" letter-spacing="1.5">COFFEE DEPENDENCY</text>
    <rect x="330" y="212" width="300" height="12" rx="6" fill="#1b1b26"/>
    <rect x="330" y="212" width="0" height="12" rx="6" fill="url(#bar)">
      <animate attributeName="width" values="0;165.0;165.0;0" keyTimes="0;0.3;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="654" y="223" fill="#f5b942" font-size="15" font-weight="bold">MODERATE</text>
    <text x="28" y="265" fill="#e6e6e6" font-size="15" letter-spacing="1.5">MISSION STATUS</text>
    <circle cx="338" cy="260" r="6" fill="#2ee66b"><animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="354" y="265" fill="#2ee66b" font-size="15" font-weight="bold" letter-spacing="3">ACTIVE</text>
  </g>
</svg>
