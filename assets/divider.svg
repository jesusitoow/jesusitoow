<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 10" width="800" height="10" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e62429" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5b942"/>
      <stop offset="100%" stop-color="#e62429" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="800" height="2" fill="#3a1015"/>
  <rect x="0" y="3.5" width="220" height="3" rx="1.5" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="-220 0" to="800 0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="400" cy="5" r="3" fill="#e62429">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
