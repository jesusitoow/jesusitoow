<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#a5f7ff"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.25"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="195" fill="url(#halo)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- gold tick ring (clockwise) -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="#f5b942" stroke-width="10" stroke-dasharray="3 91.2">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="40s" repeatCount="indefinite"/>
  </circle>

  <!-- crimson outer ring -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="#e62429" stroke-width="3" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- cyan segment ring (counter-clockwise) -->
  <circle cx="200" cy="200" r="138" fill="none" stroke="#00e5ff" stroke-width="18" stroke-opacity="0.85" stroke-dasharray="60 27.96" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="28s" repeatCount="indefinite"/>
  </circle>

  <!-- gold inner ring -->
  <circle cx="200" cy="200" r="108" fill="none" stroke="#f5b942" stroke-width="2"/>

  <!-- rotating triangle -->
  <polygon points="200,122 267.5,239 132.5,239" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="14s" repeatCount="indefinite"/>
  </polygon>

  <circle cx="200" cy="200" r="62" fill="none" stroke="#00e5ff" stroke-width="4" filter="url(#glow)"/>

  <!-- pulsing core -->
  <circle cx="200" cy="200" r="46" fill="url(#core)" filter="url(#glow)">
    <animate attributeName="r" values="40;52;40" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
